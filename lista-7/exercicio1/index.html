<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <header>
        <h1>Catálogo de Produtos</h1>
    </header>
    <main class="container">
        <div class="card">
            <img src="./assets/images/samsung.jpg" alt="Produto">
            <h2>Samsung Galaxy S26</h2>
            <p>5G, 256GB, 12GB RAM, Preto</p>
            <span>R$ 5.799,90</span>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="./assets/images/iphone.webp" alt="Produto">
            <h2>Apple Iphone 17</h2>
            <p>256GB, Preto, 6,3", 5G</p>
            <span>R$ 5.960,90</span>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="./assets/images/redmi.webp" alt="Produto">
            <h2>Redmi Note 14</h2>
            <p>256GB, 4G, Preto, 108MP</p>
            <span>R$ 1.128,00</span>
            <button>Comprar</button>
        </div>
        <div class="card">
            <img src="./assets/images/motorola.webp" alt="Produto">
            <h2>Motorola Moto G17</h2>
            <p>4G, 128GB, 50MP, Roxo</p>
            <span>R$ 899,99</span>
            <button>Comprar</button>
        </div>
    </main> 
</body>
</html>
