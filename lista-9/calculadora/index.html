<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="calculadora">

    <div class="texto">
        <h1>Padrão</h1>
    </div>

    <div class="numero">
        <p>0</p>
    </div>

    <div class="botoes">

        <button>%</button>
        <button>CE</button>
        <button>C</button>
        <button>apagar</button>

        <button>1/x</button>
        <button>x²</button>
        <button>2x</button>
        <button>÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>x</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>+</button>

        <button>+/-</button>
        <button>0</button>
        <button>,</button>
        <button class="igual">=</button>

    </div>

</main>

</body>

</html>
